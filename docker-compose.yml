services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: autopilot
      POSTGRES_PASSWORD: autopilot
      POSTGRES_DB: autopilot
    ports:
      - "${AUTOPILOT_DB_PORT:-5432}:5432"
    volumes:
      - autopilot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopilot -d autopilot"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  autopilot_pg:
